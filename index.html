<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Суперсобачки</title>
  <link rel="icon" href="data:," /> <!-- no icon yet: an empty one, so the browser doesn't ask for /favicon.ico mid-game -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
    /* The game frame (landscape): on a computer a phone-shaped 19.5:9 box in the middle of the window (same as the 3D
       frame), on a phone the whole screen — so the computer shows exactly what a phone shows. --col is its width, --row
       its height; game overlays sit in it (top: 50%; left: 50%; translate -50 %), edge UI adds the frame's offset. */
    /* --pc-pad: on a computer the frame keeps this gap to the window edges — the developer buttons (🛠, the model bar)
       live there instead of over the game; the 19.5:9 shape stays. src/core/app.js and the --ui script read it too. */
    :root { --pc-pad: 64px; --col: min(calc(100vw - 2 * var(--pc-pad)), calc((100vh - 2 * var(--pc-pad)) * 19.5 / 9));
      --row: min(calc(100vh - 2 * var(--pc-pad)), calc((100vw - 2 * var(--pc-pad)) * 9 / 19.5)); }
    /* UI scale --ui (set by the script below): every size in the game UI is calc(N px * var(--ui)). */
    :root { --ui: 1; }
    /* Safe areas (notch / camera hole, rounded corners, home bar): the browser fills env() per phone (0 on a
       computer). Every piece of game UI near an edge adds var(--sa-…) to its own margin; backgrounds and 3D stay
       full-bleed. ?notch fakes an iPhone-like cutout on a computer (html.sim-notch, src/core/app.js). */
    :root { --sa-top: env(safe-area-inset-top, 0px); --sa-bottom: env(safe-area-inset-bottom, 0px);
      --sa-left: env(safe-area-inset-left, 0px); --sa-right: env(safe-area-inset-right, 0px); }
    html.sim-notch { --sa-left: calc(59px * var(--ui)); --sa-right: calc(59px * var(--ui)); --sa-bottom: calc(21px * var(--ui)); } /* an iPhone held in landscape */
    #notchsim { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--col); height: var(--row); z-index: 30;
      pointer-events: none; border-radius: calc(48px * var(--ui)); box-shadow: 0 0 0 100vmax #000; }
    html.sim-notch #notchsim { display: block; }
    #notchsim::before { content: ''; position: absolute; left: calc(11px * var(--ui)); top: 50%; transform: translateY(-50%); width: calc(37px * var(--ui)); height: calc(126px * var(--ui));
      border-radius: calc(999px * var(--ui)); background: #000; } /* the camera island */
    #notchsim::after { content: ''; position: absolute; bottom: calc(8px * var(--ui)); left: 50%; transform: translateX(-50%); width: calc(134px * var(--ui)); height: calc(5px * var(--ui));
      border-radius: calc(999px * var(--ui)); background: rgba(255, 255, 255, 0.85); } /* the home bar */
    @media (pointer: coarse) { :root { --pc-pad: 0px; --col: 100vw; --row: 100vh; } }
    canvas { display: block; margin: 0 auto; }
    /* Game views on a computer: the game in a phone-shaped (landscape) frame in the middle of the window. */
    body.framed { background: #26324d; }
    body.framed canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      box-shadow: 0 0 0 6px #121a2e, 0 10px 40px rgba(0, 0, 0, 0.45); }
    #pause { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--col); height: var(--row); z-index: 5; display: none; align-items: center; justify-content: center;
      background: rgba(18, 26, 46, 0.45); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    #pause .card { background: #fffaf0; color: #26324d; border-radius: calc(22px * var(--ui)); padding: calc(20px * var(--ui)) calc(26px * var(--ui)); box-shadow: 0 calc(4px * var(--ui)) 0 #c9b98f;
      font-weight: 800; font-size: calc(20px * var(--ui)); text-align: center; max-width: 80vw; }
    #pause .icon::before { content: '▶'; display: block; font-size: calc(44px * var(--ui)); color: #ffb400; margin-bottom: calc(6px * var(--ui)); }
    /* Screen guard (src/ui/pause.js): phones only — black, over everything, while upright or not fullscreen. */
    #rotate { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(18px * var(--ui));
      padding: calc(24px * var(--ui)) calc(calc(24px * var(--ui)) + var(--sa-right)) calc(calc(24px * var(--ui)) + var(--sa-bottom)) calc(calc(24px * var(--ui)) + var(--sa-left)); box-sizing: border-box;
      background: #000; color: #fffaf0; text-align: center; user-select: none; -webkit-user-select: none; touch-action: none; }
    /* From the very first paint, before any script: a phone held upright sees the cover at once, not the loading screen
       cut to portrait for a frame or two. The guard's script takes over when it starts (it sets the display itself). */
    @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
    #rotate .icon { font-size: calc(64px * var(--ui)); line-height: 1; animation: turn 2.4s ease-in-out infinite; }
    @keyframes turn { 0%, 25% { transform: rotate(0deg); } 50%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    #rotate .msg { max-width: calc(320px * var(--ui)); font-size: calc(20px * var(--ui)); font-weight: 800; line-height: 1.3; }
    #rotate button { min-height: calc(52px * var(--ui)); padding: calc(12px * var(--ui)) calc(26px * var(--ui)); border: 0; border-radius: calc(999px * var(--ui)); font: inherit; font-size: calc(18px * var(--ui)); font-weight: 900;
      color: #26324d; background: #ffcf3f; box-shadow: 0 calc(5px * var(--ui)) 0 #c99a12; cursor: pointer; }
    #ui { position: fixed; z-index: 6; bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap-reverse; gap: 6px; pointer-events: none; } /* bottom left; opens upwards */
    /* Developer panel folded into the 🛠 button until opened; not on touch screens at all. */
    #ui:not(.open) > :not(.devtoggle) { display: none; }
    #ui .devtoggle { order: -1; font-size: 24px; width: 48px; height: 48px; padding: 0; } /* stays in the corner when open */
    @media (pointer: coarse) { #ui { display: none; } }
    #ui button { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px;
      background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #ui button.on, #ui select.on { background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; }
    #ui button:disabled { opacity: 0.45; cursor: default; }
    #ui select { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 13px;
      background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #ui .sep { width: 10px; }
    #ui { box-sizing: border-box; padding-right: 90px; } /* room for the corner button (QR) */
    #ui .corner { position: absolute; top: 0; right: 0; display: flex; gap: 6px; pointer-events: auto; }
    #anim { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100% - 32px); }
    #anim button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px; background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #anim button.on { background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; }
    /* Controls hint (city, run; computer only): a panel at the middle of the frame's left edge, one control a line
       (the text has line breaks), in the menu look, for a few seconds. */
    #label { position: fixed; top: 50%; left: calc(50% - var(--col) / 2 + calc(12px * var(--ui)) + var(--sa-left)); transform: translateY(-50%); z-index: 3;
      width: max-content; box-sizing: border-box; padding: calc(8px * var(--ui)) calc(14px * var(--ui));
      background: var(--cream); color: var(--ink); border: calc(3px * var(--ui)) solid var(--ink); border-radius: calc(14px * var(--ui));
      box-shadow: 0 calc(3px * var(--ui)) 0 var(--ink); font-size: calc(13px * var(--ui)); font-weight: 800; line-height: 1.55; text-align: left;
      white-space: pre-line; pointer-events: none; display: none; }
    /* Bottom bar of the model / group views: name + download. */
    #info { position: fixed; bottom: calc(16px + var(--sa-bottom)); left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px;
      background: #fffaf0; color: #26324d; padding: 6px 6px 6px 18px; border-radius: 999px; font-weight: 800; box-shadow: 0 3px 0 #c9b98f;
      white-space: nowrap; max-width: calc(100% - 32px); }
    #info button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; background: #ffcf3f; color: #26324d;
      box-shadow: 0 2px 0 #c99a12; cursor: pointer; }
    #info button:disabled { opacity: 0.6; cursor: default; }
    /* Dev QR popup: open the game on a phone. */
    #backdrop { position: fixed; inset: 0; z-index: 9; display: none; background: rgba(18, 26, 46, 0.5); }
    /* Centred popups (⚙ settings, 🛠 cheats, «Об игре», 📱 QR) in the menu look: cream, a thick ink outline. Wide and short —
       everything fits without scrolling (the max-height is only a safety net). */
    #qr { width: calc(240px * var(--ui)); }
    #settings { width: calc(520px * var(--ui)); }
    #cheats { width: calc(600px * var(--ui)); }
    #about { width: calc(420px * var(--ui)); }
    #qr, #settings, #cheats, #about { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 10;
      max-width: calc(var(--col) - var(--sa-left) - var(--sa-right) - calc(24px * var(--ui)));
      max-height: calc(var(--row) - var(--sa-top) - var(--sa-bottom) - calc(24px * var(--ui))); overflow-y: auto; box-sizing: border-box; background: var(--cream); color: var(--ink);
      padding: calc(14px * var(--ui)) calc(18px * var(--ui)); border: calc(4px * var(--ui)) solid var(--ink); border-radius: calc(18px * var(--ui));
      box-shadow: 0 calc(6px * var(--ui)) 0 var(--ink); font-size: calc(13px * var(--ui)); font-weight: 700; user-select: none; -webkit-user-select: none; }
    .popup-ui .head { text-align: center; font-size: calc(22px * var(--ui)); font-weight: 900; text-transform: uppercase; letter-spacing: calc(1px * var(--ui)); margin-bottom: calc(10px * var(--ui)); }
    .popup-ui .head .hint { font-size: calc(12px * var(--ui)); font-weight: 700; text-transform: none; letter-spacing: 0; opacity: 0.6; }
    .popup-ui button { font: inherit; font-weight: 900; color: var(--ink); cursor: pointer; }
    /* Settings rows: the name left, the control right; the row under the finger / mouse is on the lime bar. */
    #settings .row { display: flex; align-items: center; justify-content: space-between; gap: calc(12px * var(--ui)); min-height: calc(46px * var(--ui));
      padding: 0 calc(6px * var(--ui)) 0 calc(14px * var(--ui)); border: calc(3px * var(--ui)) solid transparent; border-radius: calc(12px * var(--ui)); }
    #settings .row:hover { background: var(--lime); border-color: var(--ink); }
    #settings .row .name { font-size: calc(17px * var(--ui)); font-weight: 900; text-transform: uppercase; letter-spacing: calc(0.5px * var(--ui)); }
    .stepper { display: flex; align-items: center; gap: calc(4px * var(--ui)); }
    .stepper .value { min-width: calc(110px * var(--ui)); text-align: center; font-size: calc(17px * var(--ui)); font-weight: 900; text-transform: uppercase; }
    .stepper button { width: calc(44px * var(--ui)); height: calc(44px * var(--ui)); border: 0; background: none; padding: 0; font-size: calc(18px * var(--ui)); color: #e0443a; }
    .stepper button:disabled { opacity: 0.25; cursor: default; }
    .choice { display: flex; gap: calc(6px * var(--ui)); }
    .choice button { min-height: calc(40px * var(--ui)); padding: 0 calc(12px * var(--ui)); border: calc(3px * var(--ui)) solid var(--ink); border-radius: calc(10px * var(--ui));
      background: var(--cream); font-size: calc(13px * var(--ui)); text-transform: uppercase; white-space: nowrap; }
    .choice button.picked { background: var(--lime); box-shadow: inset 0 calc(-3px * var(--ui)) 0 var(--lime-dark); }
    /* Popup bottom buttons: ink-outlined pills; lime = the main one, red = leaving / wiping. */
    .popup-ui .foot { display: flex; justify-content: center; gap: calc(10px * var(--ui)); margin-top: calc(12px * var(--ui)); }
    .popup-ui .foot button, #cheats .actions button { min-height: calc(46px * var(--ui)); padding: 0 calc(18px * var(--ui)); border: calc(3px * var(--ui)) solid var(--ink);
      border-radius: calc(999px * var(--ui)); background: var(--cream); font-size: calc(15px * var(--ui)); text-transform: uppercase; box-shadow: 0 calc(4px * var(--ui)) 0 var(--ink); }
    .popup-ui button.primary, #cheats .actions button.primary { background: var(--lime); }
    .popup-ui button.danger, #cheats .actions button.danger { background: #ff7a6b; color: #fff; }
    .popup-ui .foot button:active, #cheats .actions button:active { transform: translateY(calc(2px * var(--ui))); box-shadow: 0 calc(2px * var(--ui)) 0 var(--ink); }
    #settings .run-only, #settings .menu-only { display: none; }
    #settings.in-run .run-only, #settings.in-menu .menu-only { display: block; }
    /* The «Графика» page (class .gfx): its rows, a note and «◀ Назад» instead of the settings rows and buttons. */
    #settings .gfx-only, #settings.gfx .main-only, #settings.gfx .run-only, #settings.gfx .menu-only { display: none; }
    #settings.gfx .gfx-only { display: block; }
    #settings .more { width: calc(206px * var(--ui)); justify-content: center; } /* as wide as ◀ value ▶: the button under the values */
    #settings .row .name .hint { display: block; font-size: calc(11px * var(--ui)); font-weight: 700; text-transform: none; letter-spacing: 0; opacity: 0.6; }
    #settings .note { min-height: calc(16px * var(--ui)); margin-top: calc(4px * var(--ui)); text-align: center; font-size: calc(12px * var(--ui)); color: #e0443a; }
    /* 🛠 Cheats (dev): actions left, the look sliders right. */
    #cheats .cols { display: grid; grid-template-columns: 1fr 1.3fr; gap: calc(16px * var(--ui)); }
    #cheats .actions { display: flex; flex-direction: column; gap: calc(10px * var(--ui)); }
    #cheats .actions button { font-size: calc(13px * var(--ui)); white-space: nowrap; padding: 0 calc(12px * var(--ui)); }
    #cheats .title { font-weight: 900; font-size: calc(13px * var(--ui)); text-transform: uppercase; margin: calc(2px * var(--ui)) 0 calc(4px * var(--ui)); }
    #cheats .slider { display: flex; align-items: center; justify-content: space-between; gap: calc(10px * var(--ui)); font-size: calc(13px * var(--ui)); margin-bottom: calc(4px * var(--ui)); }
    #cheats .slider input { width: calc(170px * var(--ui)); accent-color: var(--lime-dark); cursor: pointer; }
    /* «Об игре»: the (white) studio logo on an ink plate; it pops in, then glows once. */
    #about { text-align: center; }
    #about .plate { margin: calc(4px * var(--ui)) auto calc(12px * var(--ui)); width: fit-content; padding: calc(16px * var(--ui)) calc(26px * var(--ui));
      background: var(--ink); border-radius: calc(14px * var(--ui)); }
    #about .logo { display: block; width: calc(240px * var(--ui)); height: auto; }
    #about .logo.show { animation: logo-in 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both, glow 1.2s ease-in-out 0.6s both; }
    @keyframes logo-in { from { opacity: 0; transform: scale(0.5) rotate(-4deg); } }
    @keyframes glow { 50% { filter: drop-shadow(0 0 calc(14px * var(--ui)) rgba(255, 255, 255, 0.95)) brightness(1.15); } }
    #about .text { font-size: calc(17px * var(--ui)); font-weight: 900; margin-bottom: calc(4px * var(--ui)); }
    #qr img { display: block; width: calc(216px * var(--ui)); height: calc(216px * var(--ui)); margin: 0 auto calc(8px * var(--ui)); background: #fff; border-radius: calc(8px * var(--ui)); }
    #qr .url { word-break: break-all; text-align: center; margin-bottom: calc(8px * var(--ui)); }
    #qr select { width: 100%; margin-bottom: calc(8px * var(--ui)); font: inherit; border-radius: calc(8px * var(--ui)); padding: calc(4px * var(--ui)); }
    #qr .hint { font-weight: 500; font-size: calc(12px * var(--ui)); opacity: 0.75; }
    /* Menu look (reference: Dodgeball Academia): cream panels with a thick ink outline, the picked item on a lime bar,
       heavy capitals; titles white with an ink outline. */
    :root { --ink: #2b2d42; --cream: #fff8e1; --lime: #c5e17a; --lime-dark: #8fb83a; }
    /* Splash art (placeholder: public/ui/splash.jpg) under the loading screen and the main menu — both use it, so the
       loading screen fades out over the menu without a seam. Like Unity's «Envelope Parent»: it fills the whole frame
       keeping its proportions, the edges that don't fit are cut off — no bars, no stretching. */
    .splash { background: #1d2440 url(ui/splash.jpg) center 30% / cover no-repeat; }
    /* Loading screen: on screen from the first paint, before any script. The splash, the bar at the bottom with what is
       loading; at 100 % «Нажмите, чтобы играть» fades in in its place (the tap starts the game: body.started). */
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--col); height: var(--row); z-index: 20;
      box-shadow: 0 0 0 100vmax #26324d; /* the window around the frame: dark, like the frame */
      transition: opacity 0.5s; user-select: none; -webkit-user-select: none; touch-action: none; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .foot { position: absolute; left: 50%; bottom: calc(calc(20px * var(--ui)) + var(--sa-bottom)); transform: translateX(-50%); width: clamp(calc(200px * var(--ui)), calc(100% - calc(440px * var(--ui))), calc(460px * var(--ui)));
      display: grid; justify-items: center; align-items: end; }
    #loading .foot > * { grid-area: 1 / 1; transition: opacity 0.5s; } /* bar and «tap» in the same place, cross-fading */
    #loading .progress { width: 100%; display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--ui)); }
    #loading .bar { width: 100%; height: calc(20px * var(--ui)); box-sizing: border-box; border: calc(3px * var(--ui)) solid var(--ink); border-radius: calc(999px * var(--ui));
      background: var(--cream); box-shadow: 0 calc(4px * var(--ui)) 0 var(--ink); overflow: hidden; }
    #loading .fill { width: 0; height: 100%; background: var(--lime); box-shadow: inset 0 calc(-4px * var(--ui)) 0 var(--lime-dark); transition: width 0.25s; }
    .ink-text { color: #fff; -webkit-text-stroke: calc(4px * var(--ui)) var(--ink); paint-order: stroke fill; } /* white letters, ink outline */
    #loading .step { font-size: calc(14px * var(--ui)); font-weight: 900; letter-spacing: calc(0.5px * var(--ui)); min-height: 1.2em; }
    #loading .tap { opacity: 0; font-size: calc(28px * var(--ui)); font-weight: 900; text-transform: uppercase; letter-spacing: calc(1px * var(--ui));
      -webkit-text-stroke-width: calc(6px * var(--ui)); text-shadow: 0 calc(4px * var(--ui)) 0 var(--ink); animation: pulse 1.6s ease-in-out 0.5s infinite; }
    #loading.ready { cursor: pointer; }
    #loading.ready .progress { opacity: 0; }
    #loading.ready .tap { opacity: 1; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    /* Main menu: the splash with the title and the menu panel on the right (no 3D under it). Fades in after the tap. */
    #menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: var(--col); height: var(--row); z-index: 4;
      display: none; overflow: hidden; user-select: none; -webkit-user-select: none; }
    #menu .title { position: absolute; top: calc(calc(40px * var(--ui)) + var(--sa-top)); left: calc(calc(24px * var(--ui)) + var(--sa-left)); margin: 0;
      font-size: calc(46px * var(--ui)); font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: calc(1px * var(--ui));
      -webkit-text-stroke-width: calc(8px * var(--ui)); text-shadow: 0 calc(5px * var(--ui)) 0 var(--ink); transform: rotate(-3deg); transform-origin: left; }
    #menu .panel { position: absolute; top: 0; right: 0; bottom: 0; width: calc(calc(330px * var(--ui)) + var(--sa-right)); box-sizing: border-box;
      padding: 0 calc(calc(26px * var(--ui)) + var(--sa-right)) 0 calc(56px * var(--ui)); display: flex; flex-direction: column; justify-content: center; gap: calc(10px * var(--ui));
      background: rgba(255, 248, 225, 0.88); clip-path: polygon(calc(44px * var(--ui)) 0, 100% 0, 100% 100%, 0 100%); }
    /* Every time the menu shows (after the tap, back from the city): the title drops in from above with a bounce, the
       panel slides in from the right. Before the tap (the menu is under the loading screen) both wait off screen. */
    body:not(.started) #menu .title, body:not(.started) #menu .panel { opacity: 0; }
    body.started #menu .title { animation: title-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both; }
    body.started #menu .panel { animation: panel-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
    @keyframes title-in { from { opacity: 0; transform: translateY(calc(-160px * var(--ui))) rotate(-3deg); } }
    @keyframes panel-in { from { opacity: 0; transform: translateX(110%); } }
    /* Menu items: the picked one on a lime bar with a ▶ cursor; on a computer the mouse moves the pick. */
    #menu .panel button { position: relative; display: flex; align-items: center; min-height: calc(52px * var(--ui)); padding: 0 calc(16px * var(--ui)) 0 calc(36px * var(--ui));
      border: calc(3px * var(--ui)) solid transparent; border-radius: calc(12px * var(--ui)); background: transparent; color: var(--ink); cursor: pointer;
      font: inherit; font-size: calc(21px * var(--ui)); font-weight: 900; text-transform: uppercase; letter-spacing: calc(0.5px * var(--ui)); text-align: left; white-space: nowrap; }
    #menu .panel button.picked, #menu .panel button:hover { background: var(--lime); border-color: var(--ink); box-shadow: 0 calc(4px * var(--ui)) 0 var(--ink); }
    #menu .panel:hover button.picked:not(:hover) { background: transparent; border-color: transparent; box-shadow: none; }
    #menu .panel button.picked::before, #menu .panel button:hover::before { content: '▶'; position: absolute; left: calc(12px * var(--ui)); font-size: calc(14px * var(--ui)); }
    #menu .panel:hover button.picked:not(:hover)::before { content: none; }
    #menu .panel button:active { transform: translateY(calc(2px * var(--ui))); box-shadow: 0 calc(2px * var(--ui)) 0 var(--ink); }
