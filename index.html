<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Puppy City — дома</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
    /* The game column: on a computer a phone-shaped 9:19.5 strip in the middle of the window (same as the 3D frame),
       on a phone the whole screen — so the computer shows exactly what a phone shows. */
    :root { --col: min(100vw, calc(100vh * 9 / 19.5)); }
    /* Safe areas (notch / camera hole, rounded corners, home bar): the browser fills env() per phone (0 on a
       computer). Every piece of game UI near an edge adds var(--sa-…) to its own margin; backgrounds and 3D stay
       full-bleed. ?notch fakes an iPhone-like cutout on a computer (html.sim-notch, src/main.js). */
    :root { --sa-top: env(safe-area-inset-top, 0px); --sa-bottom: env(safe-area-inset-bottom, 0px);
      --sa-left: env(safe-area-inset-left, 0px); --sa-right: env(safe-area-inset-right, 0px); }
    html.sim-notch { --sa-top: 59px; --sa-bottom: 34px; }
    #notchsim { display: none; position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 30;
      pointer-events: none; border-radius: 48px; box-shadow: 0 0 0 100vmax #000; }
    html.sim-notch #notchsim { display: block; }
    #notchsim::before { content: ''; position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px;
      border-radius: 999px; background: #000; } /* the camera island */
    #notchsim::after { content: ''; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px;
      border-radius: 999px; background: rgba(255, 255, 255, 0.85); } /* the home bar */
    @media (pointer: coarse) { :root { --col: 100vw; } }
    canvas { display: block; margin: 0 auto; }
    /* Street on a computer: the game in a phone-shaped (portrait) frame in the middle of the window. */
    body.framed { background: #26324d; }
    body.framed canvas { box-shadow: 0 0 0 6px #121a2e, 0 10px 40px rgba(0, 0, 0, 0.45); }
    #pause { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 5; display: none; align-items: center; justify-content: center;
      background: rgba(18, 26, 46, 0.45); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    #pause .card { background: #fffaf0; color: #26324d; border-radius: 22px; padding: 20px 26px; box-shadow: 0 4px 0 #c9b98f;
      font-weight: 800; font-size: 20px; text-align: center; max-width: 80vw; }
    #pause .icon::before { content: '▶'; display: block; font-size: 44px; color: #ffb400; margin-bottom: 6px; }
    #pause[data-reason="rotate"] { cursor: default; }
    #pause[data-reason="rotate"] .icon::before { content: '📱'; }
    #ui { position: fixed; z-index: 6; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
    /* Developer panel folded into the 🛠 button until opened; not on touch screens at all. */
    #ui:not(.open) > :not(.devtoggle) { display: none; }
    #ui .devtoggle { font-size: 24px; width: 48px; height: 48px; padding: 0; }
    @media (pointer: coarse) { #ui { display: none; } }
    #ui button { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px;
      background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #ui button.on, #ui select.on { background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; }
    #ui button:disabled { opacity: 0.45; cursor: default; }
    #ui select { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 13px;
      background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #ui .sep { width: 10px; }
    #ui { box-sizing: border-box; padding-right: 90px; } /* room for the corner button (QR) */
    #ui .corner { position: absolute; top: 0; right: 0; display: flex; gap: 6px; pointer-events: auto; }
    #settings .slider { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 999px; padding: 4px 14px;
      margin-bottom: 6px; background: #fff3d6; font-weight: 700; font-size: 13px; }
    #settings .slider input { width: 140px; accent-color: #ffcf3f; cursor: pointer; }
    #settings select { width: 100%; margin-bottom: 6px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 6px 12px;
      background: #fff3d6; color: #26324d; cursor: pointer; }
    #settings .title { font-weight: 800; font-size: 14px; margin: 6px 4px 6px; }
    #settings .hint { font-weight: 500; font-size: 12px; opacity: 0.75; margin: 4px 4px 0; }
    #anim { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100% - 32px); }
    #anim button { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px; background: #fffaf0; color: #26324d; box-shadow: 0 3px 0 #c9b98f; cursor: pointer; }
    #anim button.on { background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; }
    #label { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #fffaf0; color: #26324d;
      padding: 8px 18px; border-radius: 999px; font-weight: 800; box-shadow: 0 3px 0 #c9b98f; display: none; }
    /* Bottom bar of the model / group views: name + download. */
    #info { position: fixed; bottom: calc(16px + var(--sa-bottom)); left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px;
      background: #fffaf0; color: #26324d; padding: 6px 6px 6px 18px; border-radius: 999px; font-weight: 800; box-shadow: 0 3px 0 #c9b98f;
      white-space: nowrap; max-width: calc(100% - 32px); }
    #info button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; background: #ffcf3f; color: #26324d;
      box-shadow: 0 2px 0 #c99a12; cursor: pointer; }
    #info button:disabled { opacity: 0.6; cursor: default; }
    /* Dev QR popup: open the game on a phone. */
    #backdrop { position: fixed; inset: 0; z-index: 9; display: none; background: rgba(18, 26, 46, 0.5); }
    #settings, #cheats { width: 280px; }
    #qr { width: 240px; }
    #qr, #settings, #cheats { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 10;
      max-height: calc(100vh - var(--sa-top) - var(--sa-bottom) - 24px); overflow-y: auto; box-sizing: border-box; background: #fffaf0; color: #26324d;
      padding: 12px; border-radius: 16px; box-shadow: 0 3px 0 #c9b98f; font-size: 13px; font-weight: 700; }
    #qr img { display: block; width: 216px; height: 216px; margin: 0 auto 8px; background: #fff; border-radius: 8px; }
    #qr .url { word-break: break-all; text-align: center; margin-bottom: 8px; }
    #qr select { width: 100%; margin-bottom: 8px; font: inherit; border-radius: 8px; padding: 4px; }
    #qr .hint { font-weight: 500; font-size: 12px; opacity: 0.75; }
    /* Loading screen: on screen from the first paint, before any script or asset. */
    #loading { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 20;
      box-shadow: 0 0 0 100vmax #26324d; /* the window around the column: dark, like the frame */ display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: linear-gradient(#5fb4ff 0%, #9fd3ff 55%, #8fdc6a 55%, #6cc34a 100%); color: #26324d;
      transition: opacity 0.4s; user-select: none; -webkit-user-select: none; touch-action: none; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .logo { font-size: 64px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.15)); }
    #loading h1 { margin: 0; font-size: 40px; font-weight: 900; color: #fffaf0; text-shadow: 0 4px 0 #26324d; letter-spacing: 1px; }
    #loading .sub { margin-top: -10px; font-weight: 800; color: #26324d; opacity: 0.8; }
    #loading .bar { width: min(70vw, 300px); height: 18px; border-radius: 999px; background: #fffaf0; box-shadow: 0 3px 0 #c9b98f; overflow: hidden; }
    #loading .fill { width: 0; height: 100%; background: #ffcf3f; border-radius: 999px; transition: width 0.25s; }
    #loading .step { font-size: 13px; font-weight: 700; opacity: 0.75; min-height: 1.2em; }
    #loading .tap { display: none; font-size: 22px; font-weight: 900; color: #fffaf0; text-shadow: 0 3px 0 #26324d; animation: pulse 1.2s ease-in-out infinite; }
    #loading .studio { position: absolute; bottom: calc(24px + var(--sa-bottom)); left: 50%; transform: translateX(-50%); width: 160px; height: 160px;
      filter: drop-shadow(0 4px 0 rgba(38, 50, 77, 0.5)); pointer-events: none; }
    #loading.ready { cursor: pointer; }
    #loading.ready .bar, #loading.ready .step { display: none; }
    #loading.ready .tap { display: block; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    /* Main menu over the 3D hub: a phone-wide column in the middle of the window (matches the portrait frame). */
    #menu { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 4;
      display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(72px + var(--sa-top)) calc(16px + var(--sa-right)) calc(28px + var(--sa-bottom)) calc(16px + var(--sa-left)); box-sizing: border-box;
      pointer-events: none; user-select: none; -webkit-user-select: none; }
    /* Wallet chip (main menu top left, map header right): the bones you have. */
    .wallet { background: rgba(38, 50, 77, 0.6); color: #fffaf0; border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 18px;
      text-shadow: 0 2px 0 #26324d; white-space: nowrap; }
    #menu .wallet { position: absolute; top: calc(14px + var(--sa-top)); left: calc(14px + var(--sa-left)); }
    #menu h1 { margin: 0; font-size: 34px; font-weight: 900; color: #fffaf0; text-shadow: 0 4px 0 #26324d; text-align: center; }
    #menu .bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #menu .dog { display: flex; align-items: center; gap: 10px; }
    #menu .dog .name { min-width: 130px; text-align: center; background: #fffaf0; color: #26324d; border-radius: 999px; padding: 10px 14px;
      font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 #c9b98f; }
    #menu button { pointer-events: auto; border: 0; border-radius: 999px; font-weight: 900; color: #26324d; cursor: pointer;
      background: #fffaf0; box-shadow: 0 4px 0 #c9b98f; min-width: 48px; min-height: 48px; font-size: 18px; }
    #menu button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9b98f; }
    #menu .play { width: 80%; font-size: 26px; padding: 14px; background: #ffcf3f; box-shadow: 0 5px 0 #c99a12; }
    #menu .play:active { box-shadow: 0 3px 0 #c99a12; }
    #menu .small { padding: 10px 22px; font-size: 16px; }
    /* In-run menu button: top right of the game column. */
    #runmenu { position: fixed; top: calc(12px + var(--sa-top)); right: calc(50% - var(--col) / 2 + 12px + var(--sa-right)); z-index: 5; display: none;
      width: 48px; height: 48px; border: 0; border-radius: 50%; background: #fffaf0; color: #26324d; font-size: 24px; font-weight: 900;
      box-shadow: 0 4px 0 #c9b98f; cursor: pointer; }
    /* Mission HUD: top of the game column, left of ☰. */
    #hud { position: fixed; top: calc(12px + var(--sa-top)); left: calc(50% - var(--col) / 2 + 12px + var(--sa-left));
      width: calc(var(--col) - 96px - var(--sa-left) - var(--sa-right)); z-index: 5; display: none; pointer-events: none; color: #fffaf0;
      font-weight: 900; text-shadow: 0 2px 0 #26324d; user-select: none; -webkit-user-select: none; }
    #hud .row { display: flex; justify-content: space-between; align-items: center; font-size: 20px; margin-bottom: 6px; }
    #hud .lives { letter-spacing: 2px; }
    #hud .timer { display: none; background: rgba(38, 50, 77, 0.55); border-radius: 999px; padding: 2px 12px; }
    #hud .timer.low { color: #ff7a6b; }
    #hud .bones { background: rgba(38, 50, 77, 0.55); border-radius: 999px; padding: 2px 12px; }
    #hud .progress { display: flex; align-items: center; gap: 8px; }
    #hud .bar { flex: 1; height: 12px; border-radius: 999px; background: rgba(38, 50, 77, 0.45); overflow: hidden; }
    #hud .fill { height: 100%; width: 0; border-radius: 999px; background: #ffcf3f; box-shadow: inset 0 -3px 0 #e0a412; }
    #hud .dist { font-size: 13px; min-width: 86px; text-align: right; }
    /* Map shop (src/ui/shop.js): same card as the chest, a list of offers. */
    #shop { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 8; display: none;
      align-items: center; justify-content: center; background: rgba(18, 26, 46, 0.6); user-select: none; -webkit-user-select: none; }
    #shop .box { position: relative; width: calc(100% - 24px - var(--sa-left) - var(--sa-right)); max-width: 420px; box-sizing: border-box;
      max-height: calc(100vh - var(--sa-top) - var(--sa-bottom) - 24px); overflow-y: auto;
      background: #fffaf0; color: #26324d; border-radius: 24px; padding: 18px 14px 14px; box-shadow: 0 6px 0 #c9b98f; text-align: center; }
    #shop .close { position: absolute; z-index: 2; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%;
      background: transparent; font: inherit; font-size: 20px; font-weight: 900; color: #26324d; cursor: pointer; }
    #shop .kind { font-size: 12px; font-weight: 800; opacity: 0.65; padding: 0 36px; }
    #shop .name { font-size: 20px; font-weight: 900; margin: 2px 0 8px; padding: 0 36px; }
    #shop .wallet { display: inline-block; margin-bottom: 10px; font-size: 16px; }
    #shop .offers { display: flex; flex-direction: column; gap: 8px; }
    #shop .offer { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff3d6; border-radius: 16px; padding: 10px; }
    #shop .offer.done { opacity: 0.6; }
    #shop .offer .icon { font-size: 34px; width: 48px; text-align: center; flex: none; }
    #shop .offer .info { flex: 1; min-width: 0; }
    #shop .offer .title { font-weight: 900; }
    #shop .offer .desc { font-size: 12px; font-weight: 600; opacity: 0.7; }
    #shop .offer .buy { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
    #shop .offer .price { font-size: 13px; font-weight: 700; white-space: nowrap; }
    #shop .offer .price s { opacity: 0.5; }
    #shop .offer .price .off { color: #e0443a; font-weight: 900; }
    #shop .offer button { min-height: 40px; border: 0; border-radius: 999px; padding: 0 14px; font: inherit; font-weight: 900; font-size: 14px;
      color: #26324d; background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; cursor: pointer; white-space: nowrap; }
    #shop .offer button:disabled { background: #e8e1d2; box-shadow: 0 3px 0 #c9b98f; cursor: default; }
    /* Chest: its mini-game in a card over the map (src/ui/chest.js, src/ui/puzzles.js). */
    #chest { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 8; display: none;
      align-items: center; justify-content: center; background: rgba(18, 26, 46, 0.6); user-select: none; -webkit-user-select: none; }
    #chest .box { position: relative; width: calc(100% - 24px - var(--sa-left) - var(--sa-right)); max-width: 420px; box-sizing: border-box;
      max-height: calc(100vh - var(--sa-top) - var(--sa-bottom) - 24px); overflow-y: auto;
      background: #fffaf0; color: #26324d; border-radius: 24px; padding: 18px 14px 14px; box-shadow: 0 6px 0 #c9b98f; text-align: center; }
    #chest .close { position: absolute; z-index: 2; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent;
      font: inherit; font-size: 20px; font-weight: 900; color: #26324d; cursor: pointer; }
    #chest .kind { font-size: 13px; font-weight: 800; opacity: 0.65; }
    #chest .name { font-size: 20px; font-weight: 900; margin-bottom: 10px; padding: 0 36px; }
    #chest .hint { font-size: 12px; font-weight: 600; opacity: 0.7; margin-top: 8px; min-height: 1em; }
    #chest button { font: inherit; }
    .pz-note { font-weight: 800; margin: 8px 0; min-height: 1.2em; }
    .pz-history { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .pz-row { display: flex; gap: 6px; justify-content: center; align-items: center; }
    .pz-cell { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; background: #f3ead6; border-radius: 10px; }
    .pz-cell.exact { background: #5cc96e; box-shadow: 0 2px 0 #2e9e4f; }
    .pz-cell.near { background: #ffcf3f; box-shadow: 0 2px 0 #c99a12; }
    .pz-cell.miss { background: #cfc6b4; opacity: 0.7; }
    .pz-sym.absent { opacity: 0.3; filter: grayscale(1); }
    .pz-current .pz-slot { width: 48px; height: 48px; border: 3px dashed #c9b98f; border-radius: 12px; background: #fff; font-size: 26px; cursor: pointer; }
    .pz-palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 0; }
    .pz-sym { width: 50px; height: 50px; border: 0; border-radius: 14px; background: #ffe49a; box-shadow: 0 3px 0 #d9b04a; font-size: 26px; cursor: pointer; }
    .pz-sym:disabled { opacity: 0.35; cursor: default; }
    .pz-actions { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
    .pz-btn { min-width: 56px; min-height: 46px; border: 0; border-radius: 999px; padding: 0 18px; background: #fffaf0; box-shadow: 0 3px 0 #c9b98f;
      font-weight: 900; font-size: 17px; color: #26324d; cursor: pointer; }
    .pz-main { background: #ffcf3f; box-shadow: 0 3px 0 #c99a12; }
    .pz-btn:disabled { opacity: 0.45; cursor: default; }
    .pz-slide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(270px, 100%); margin: 0 auto; }
    .pz-tile { aspect-ratio: 1; border: 0; border-radius: 14px; background: #ff8a3d; box-shadow: 0 4px 0 #c45f1c; color: #fffaf0; font-size: 34px;
      font-weight: 900; text-shadow: 0 2px 0 #26324d; cursor: pointer; }
    .pz-gap { background: #eadfc7; box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.08); cursor: default; }
    .pz-pipes-wrap { display: flex; align-items: stretch; gap: 4px; justify-content: center; }
    .pz-pipe-side { display: grid; grid-template-rows: repeat(5, 1fr); width: 30px; font-size: 24px; align-items: center; }
    .pz-pipes { display: grid; gap: 3px; width: min(270px, 100%); }
    .pz-pipe { aspect-ratio: 1; padding: 0; border: 0; border-radius: 8px; background: #f3ead6; cursor: pointer; }
    .pz-pipe svg { width: 100%; height: 100%; display: block; }
    #chest .reward .big { font-size: 64px; }
    #chest .reward .title { font-size: 24px; font-weight: 900; color: #2e9e4f; }
    #chest .reward .gain { font-size: 28px; font-weight: 900; margin: 10px 0 14px; }
    #chest .reward .take { min-height: 50px; width: 70%; border: 0; border-radius: 999px; background: #ffcf3f; box-shadow: 0 4px 0 #c99a12;
      font-weight: 900; font-size: 19px; color: #26324d; cursor: pointer; }
    /* Boosters in a run (src/ui/boosters.js): bottom left of the game column. */
    #boosters { position: fixed; bottom: calc(16px + var(--sa-bottom)); left: calc(50% - var(--col) / 2 + 14px + var(--sa-left)); z-index: 5;
      display: none; gap: 10px; align-items: flex-end; }
    #boosters button { position: relative; border: 0; border-radius: 50%; background: #fffaf0; box-shadow: 0 4px 0 #c9b98f; cursor: pointer; padding: 0; }
    #boosters button:active { transform: translateY(2px); }
    #boosters .bag { width: 52px; height: 52px; font-size: 26px; }
    #boosters .quick { width: 64px; height: 64px; font-size: 32px; background: #ffe49a; box-shadow: 0 4px 0 #d9b04a; }
    #boosters .quick .count { position: absolute; right: -4px; top: -4px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box;
      border-radius: 999px; background: #26324d; color: #fffaf0; font-size: 13px; font-weight: 900; line-height: 22px; }
    #boosters .quick.empty { filter: grayscale(1); opacity: 0.55; }
    #boosters .quick.active { box-shadow: 0 0 0 5px rgba(255, 207, 63, 0.7), 0 4px 0 #d9b04a; animation: glow 0.8s ease-in-out infinite alternate; }
    #boosters .quick .left { position: absolute; left: 0; right: 0; bottom: -22px; font-size: 14px; font-weight: 900; color: #fffaf0; text-shadow: 0 2px 0 #26324d; }
    @keyframes glow { to { box-shadow: 0 0 0 9px rgba(255, 207, 63, 0.35), 0 4px 0 #d9b04a; } }
    #backpack { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--col); z-index: 8; display: none;
      align-items: center; justify-content: center; background: rgba(18, 26, 46, 0.55); user-select: none; -webkit-user-select: none; }
    #backpack .box { position: relative; width: calc(100% - 24px - var(--sa-left) - var(--sa-right)); max-width: 420px; box-sizing: border-box;
      background: #fffaf0; color: #26324d; border-radius: 24px; padding: 18px 14px 14px; box-shadow: 0 6px 0 #c9b98f; }
    #backpack .close { position: absolute; z-index: 2; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%;
      background: transparent; font: inherit; font-size: 20px; font-weight: 900; color: #26324d; cursor: pointer; }
    #backpack .name { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 10px; }
    #backpack .row { display: flex; align-items: center; gap: 10px; background: #fff3d6; border-radius: 16px; padding: 10px; margin-bottom: 8px; }
    #backpack .row .icon { font-size: 34px; width: 46px; text-align: center; }
